# Data pipeline configuration (Component A).
# Paths are relative to the project root.

dataset:
  name: "Default of Credit Card Clients"
  uci_id: 350
  source_url: "https://archive.ics.uci.edu/dataset/350/default+of+credit+card+clients"
  doi: "10.24432/C55S3H"
  license: "CC BY 4.0"
  raw_path: "data/raw/default of credit card clients.xls"
  # SHA-256 of the file used in the experiments. The loader warns if the file changes.
  expected_sha256: "30c6be3abd8dcfd3e6096c828bad8c2f011238620f5369220bd60cfc82700933"
  expected_rows: 30000

split:
  random_seed: 42
  train_fraction: 0.60
  validation_fraction: 0.20
  test_fraction: 0.20
  stratify: true
  output_path: "data/processed/splits.json"

outputs:
  quality_report: "reports/data_quality_report.json"
  metadata: "data/processed/dataset_metadata.json"
