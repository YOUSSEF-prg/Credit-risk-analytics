[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-analytics"
version = "0.1.0"
description = "Credit risk analytics with explainable ML and a grounded RAG assistant (UCI dataset 350)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Youssef Kourai" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]

[tool.ruff.lint.per-file-ignores]
# Streamlit/Plotly UI code: long declarative chart and widget calls read better unwrapped
"app.py" = ["E501"]
"pages/*.py" = ["E501", "N999"]
"src/dashboard/*.py" = ["E501"]
